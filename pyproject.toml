[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-building-scan"
version = "0.1.0"
description = "Geospatial analysis toolkit with Quarto notebook publishing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "SPARC Team" }
]
dependencies = [
  "geopandas>=1.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.0",
  "folium>=0.17.0",
  "xarray>=2025.1.0",
  "rioxarray>=0.18.0",
  "obstore>=0.8.0",
  "zarr>=2.18.0",
  "overturemaps[geopandas]>=1.0.0"
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
  "jupytext>=1.16.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["building_coverage_helper"]

[tool.setuptools.packages.find]
where = ["src"]
